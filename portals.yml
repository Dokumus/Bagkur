    enabled: true
  - name: BuiltIn — Data/BI
    query: 'site:builtin.com "Data Analyst" OR "Data Scientist" OR "Business Intelligence" OR "Analytics Engineer" (Amsterdam OR Netherlands OR Munich OR remote)'
    enabled: true
  - name: The Muse — Data/BI
    query: 'site:themuse.com "Data Analyst" OR "Data Scientist" OR "Business Intelligence" (Netherlands OR Amsterdam OR Munich OR München OR remote)'
    enabled: true
  - name: talent.com (Neuvoo) — Data/BI
    query: 'site:talent.com "Data Analyst" OR "Data Scientist" OR "Business Intelligence" OR "Veri Analisti" (Netherlands OR Amsterdam OR Munich OR München OR Ankara)'
    enabled: true
  - name: Comparably — Data/BI
    query: 'site:comparably.com "Data Analyst" OR "Data Scientist" OR "Business Intelligence" (Netherlands OR Amsterdam OR Munich OR remote)'
    enabled: true

