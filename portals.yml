# Portal Scanner Configuration
# Used by /career-ops scan to discover new offers automatically.
#
# Strategy (3 levels):
#   1. Playwright → careers_url of each company (real-time, reliable)
#   2. Greenhouse API → structured JSON (fast, Greenhouse-only)
#   3. WebSearch with site: filters (broad discovery, may be stale)
#
# IMPORTANT: Each company in tracked_companies MUST have careers_url.
#
# HOW TO CUSTOMIZE:
#   1. Copy this file to portals.yml in the project root
#   2. Edit title_filter.positive with YOUR target role keywords
#   3. Add/remove companies in tracked_companies
#   4. Adjust search_queries for your preferred job boards
#   5. Set enabled: false on companies you don't care about

# -- Title filter --
# The scanner uses these keywords to decide if a title is relevant.
# At least 1 positive must match AND 0 negatives must match (case-insensitive).

title_filter:
  positive:
    # -- Data & Analytics roles --
    - "Data Analyst"
    - "Data Scientist"
    - "Business Intelligence"
    - "BI Analyst"
    - "BI Developer"
    - "BI Engineer"
    - "Business Analyst"
    - "Process Analyst"
    - "Journey Analyst"
    - "Customer Experience Analyst"
    - "CX Analyst"
    - "Product Analyst"
    - "Analytics Engineer"
    - "Analytics Manager"
    - "Reporting Analyst"
    - "Insights Analyst"
    - "Data Engineer"
    # -- Türkçe başlıklar (TR panoları: kariyer.net, techcareer.net) --
    # Bunlar olmadan Türkçe yazılmış ilanlar başlık filtresinden eleniyordu.
    - "Veri Analisti"
    - "Veri Bilimci"
    - "Veri Bilimi"
    - "Veri Mühendisi"
    - "İş Zekası"
    - "İş Analisti"
    - "Raporlama Uzmanı"
    - "Raporlama Analisti"
    - "Veri Uzmanı"
    - "Analitik Uzmanı"
    - "İş Zekası Uzmanı"
    # -- AI/ML roles (adjacent) --
    - "AI"
    - "ML"
    - "Machine Learning"
    - "NLP"
    - "MLOps"
  negative:
    # [CUSTOMIZE] Add keywords for roles you want to exclude
    # NOTE: "Junior"/"Entry"/"Graduate" are intentionally NOT excluded — the candidate
    # WANTS junior/0–2yr Data Scientist & Data Engineer roles (no direct DS/DE experience).
    # The evaluator caps SENIOR DS/DE instead. Student/internship roles stay excluded.
    - "Intern"
    # -- Türkçe elemeler (TR panoları için) --
    - "Stajyer"
    - "Staj "
    - "Bursiyer"
    - "Çırak"
    - "Working Student"
    - "Werkstudent"
    - "Praktikum"
    - "Apprentice"
    - "Sales Development"
    - "Business Development Representative"
    - ".NET"
    - "Java "
    - "iOS"
    - "Android"
    - "PHP"
    - "Ruby"
    - "Embedded"
    - "Firmware"
    - "FPGA"
    - "ASIC"
    - "Blockchain"
    - "Web3"
    - "Crypto"
    - "Salesforce Admin"
    - "SAP "
    - "Oracle EBS"
    - "Mainframe"
    - "COBOL"
  seniority_boost:
    # These prefixes add relevance but are not required
    - "Senior"
    - "Staff"
    - "Principal"
    - "Lead"
    - "Head"
    - "Director"

# -- Search queries --
# Each query triggers a WebSearch. Use site: to filter by portal.
# The scanner extracts title, URL, and company from results.
#
# Tailored to Doga's roles (Data Analyst / Data Scientist / BI / Business Analyst,
# Analytics/Data Engineer adjacent) and location scope (Netherlands + Munich/Bavaria).
# Location keywords aid discovery; config/locations.json enforces the final filter.

search_queries:
  # ===== NETHERLANDS — Data Analyst / Scientist =====
  - name: Greenhouse NL — Data Analyst/Scientist
    query: 'site:job-boards.eu.greenhouse.io OR site:job-boards.greenhouse.io "Data Analyst" OR "Data Scientist" OR "Analytics Engineer" Netherlands OR Amsterdam'
    enabled: true

  - name: Ashby NL — Data Analyst/Scientist
    query: 'site:jobs.ashbyhq.com "Data Analyst" OR "Data Scientist" OR "Analytics Engineer" Netherlands OR Amsterdam'
    enabled: true

  - name: Lever NL — Data Analyst/Scientist
    query: 'site:jobs.lever.co "Data Analyst" OR "Data Scientist" OR "Analytics Engineer" Netherlands OR Amsterdam'
    enabled: true

  - name: LinkedIn NL — Data roles
    query: 'site:linkedin.com/jobs "Data Analyst" OR "Data Scientist" OR "Analytics Engineer" Amsterdam OR Netherlands'
    enabled: true

  - name: Workable NL — Data roles
    query: 'site:apply.workable.com "Data Analyst" OR "Data Scientist" OR "Business Intelligence" Netherlands OR Amsterdam'
    enabled: true

  # ===== NETHERLANDS — BI / Business / Product Analyst =====
  - name: Greenhouse NL — BI & Business Analyst
    query: 'site:job-boards.eu.greenhouse.io OR site:job-boards.greenhouse.io "Business Intelligence" OR "BI Analyst" OR "BI Developer" OR "Business Analyst" OR "Product Analyst" Netherlands OR Amsterdam'
    enabled: true

  - name: Ashby/Lever NL — BI & Business Analyst
    query: 'site:jobs.ashbyhq.com OR site:jobs.lever.co "Business Intelligence" OR "Business Analyst" OR "Product Analyst" Netherlands OR Amsterdam'
    enabled: true

  # ===== MUNICH / BAVARIA — Data Analyst / Scientist =====
  - name: Greenhouse Munich — Data Analyst/Scientist
    query: 'site:job-boards.eu.greenhouse.io OR site:job-boards.greenhouse.io "Data Analyst" OR "Data Scientist" OR "Analytics Engineer" Munich OR München OR Bavaria'
    enabled: true

  - name: Ashby/Lever Munich — Data Analyst/Scientist
    query: 'site:jobs.ashbyhq.com OR site:jobs.lever.co "Data Analyst" OR "Data Scientist" OR "Analytics Engineer" Munich OR München'
    enabled: true

  - name: LinkedIn Munich — Data roles
    query: 'site:linkedin.com/jobs "Data Analyst" OR "Data Scientist" OR "Business Intelligence" Munich OR München'
    enabled: true

  # ===== MUNICH / BAVARIA — BI / Business Analyst =====
  - name: Greenhouse Munich — BI & Business Analyst
    query: 'site:job-boards.eu.greenhouse.io OR site:job-boards.greenhouse.io "Business Intelligence" OR "BI Analyst" OR "Business Analyst" OR "Product Analyst" Munich OR München OR Bavaria'
    enabled: true

  # ===== ADJACENT — Analytics / Data Engineer (dbt, BigQuery) =====
  # Lower priority: only surfaced if a strong experience match. Disable if too noisy.
  - name: Greenhouse — Analytics/Data Engineer (NL+Munich)
    query: 'site:job-boards.eu.greenhouse.io OR site:job-boards.greenhouse.io "Analytics Engineer" OR "Data Engineer" dbt OR BigQuery Netherlands OR Amsterdam OR Munich'
    enabled: true

  # ===== AGGREGATORS (high volume) =====
  # hiring.cafe has a public JSON search API — the scanner should POST to it directly
  # (https://hiring.cafe/api/search-jobs) with location + role filters, not just site: search.
  - name: hiring.cafe — NL Data/BI
    query: 'site:hiring.cafe "Data Analyst" OR "Data Scientist" OR "Business Intelligence" OR "Analytics Engineer" Netherlands OR Amsterdam'
    enabled: true
  - name: hiring.cafe — Munich Data/BI
    query: 'site:hiring.cafe "Data Analyst" OR "Data Scientist" OR "Business Intelligence" Munich OR München'
    enabled: true
  - name: Indeed NL — Data/BI
    query: 'site:nl.indeed.com OR site:indeed.com "Data Analyst" OR "Data Scientist" OR "Business Intelligence Analyst" Amsterdam OR Netherlands'
    enabled: true
  - name: Indeed DE — Munich Data/BI
    query: 'site:de.indeed.com OR site:indeed.com "Data Analyst" OR "Data Scientist" OR "Business Intelligence" Munich OR München'
    enabled: true
  - name: Glassdoor NL+Munich — Data
    query: 'site:glassdoor.com "Data Analyst" OR "Data Scientist" OR "Business Intelligence" Amsterdam OR Netherlands OR Munich'
    enabled: true
  - name: Ashby NL+Munich — Data (board API)
    query: 'site:jobs.ashbyhq.com "Data Analyst" OR "Data Scientist" OR "Analytics Engineer" OR "Business Intelligence" Netherlands OR Amsterdam OR Munich'
    enabled: true
  - name: LinkedIn NL+DE — broad Data
    query: 'site:linkedin.com/jobs "Data Analyst" OR "Data Scientist" OR "BI Analyst" OR "Analytics Engineer" (Amsterdam OR Netherlands OR Munich OR München)'
    enabled: true

  # ===== TÜRKİYE — 7 il, sektör bağımsız (Data/BI/Analytics) =====
  # Kapsam illeri: İstanbul, İzmir, Ankara, Antalya, Kocaeli, Samsun, Eskişehir.
  # Savunma sanayii kısıtı KALDIRILDI — her sektör kapsam içinde.
  # İl listesi config/locations.json ("tr" bölgesi) ile aynı tutulmalı.
  - name: LinkedIn TR — Data/DS (İstanbul+İzmir+Ankara)
    query: 'site:tr.linkedin.com/jobs OR site:linkedin.com/jobs "Data Analyst" OR "Veri Analisti" OR "Data Scientist" OR "Veri Bilimci" (Istanbul OR İstanbul OR Izmir OR İzmir OR Ankara)'
    enabled: true
  - name: LinkedIn TR — BI/BA (İstanbul+İzmir+Ankara)
    query: 'site:tr.linkedin.com/jobs OR site:linkedin.com/jobs "Business Intelligence" OR "İş Zekası" OR "Business Analyst" OR "İş Analisti" OR "Raporlama Uzmanı" (Istanbul OR İstanbul OR Izmir OR İzmir OR Ankara)'
    enabled: true
  - name: LinkedIn TR — Data/BI (Antalya+Kocaeli+Samsun+Eskişehir)
    query: 'site:tr.linkedin.com/jobs OR site:linkedin.com/jobs "Data Analyst" OR "Veri Analisti" OR "Business Intelligence" OR "İş Zekası" OR "Data Scientist" (Antalya OR Kocaeli OR Izmit OR Gebze OR Samsun OR Eskisehir OR Eskişehir)'
    enabled: true
  - name: kariyer.net — Data/BI (7 il)
    query: 'site:kariyer.net "Veri Analisti" OR "Data Analyst" OR "Data Scientist" OR "İş Zekası" OR "Business Intelligence" OR "İş Analisti" (İstanbul OR İzmir OR Ankara OR Antalya OR Kocaeli OR Samsun OR Eskişehir)'
    enabled: true
  - name: Indeed TR — Data/BI (7 il)
    query: 'site:tr.indeed.com "Data Analyst" OR "Veri Analisti" OR "Data Scientist" OR "Business Intelligence" OR "İş Zekası" (İstanbul OR İzmir OR Ankara OR Antalya OR Kocaeli OR Samsun OR Eskişehir)'
    enabled: true
  - name: secretcv / yenibiris / toptalent — Data/BI (7 il)
    query: 'site:secretcv.com OR site:yenibiris.com OR site:toptalent.co "Veri Analisti" OR "Data Analyst" OR "İş Zekası" OR "Business Intelligence" OR "Data Scientist" (İstanbul OR İzmir OR Ankara OR Antalya OR Kocaeli OR Samsun OR Eskişehir)'
    enabled: true

  # ===== GENEL İŞ PANOLARI (ekran görüntülerinden) — rol + lokasyon kapsamlı =====
  # Niş/bölgesel panolar (ABD diversity, pharma, Çin) config/sources.json içinde
  # kayıtlı ama enabled:false; NL/Münih/Ankara veri rolleri için isabet düşük.
  - name: Dice — Data/BI (NL+Munich+Ankara)
    query: 'site:dice.com "Data Analyst" OR "Data Scientist" OR "Business Intelligence" OR "Analytics Engineer" (Netherlands OR Amsterdam OR Munich OR München OR Ankara OR remote)'
